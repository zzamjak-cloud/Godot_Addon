<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT Godot Addons</title>
<meta name="description" content="Unity CAT 패키지를 Godot 4.7+ 애드온으로 옮긴 모음">
<style>
  :root { --bg: #161a26; --panel: #1f2434; --line: #333a52; --ink: #eef0f7; --soft: #a9b0c6; --amber: #ffb13b; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; line-height: 1.7; }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 36px; margin: 0 0 8px; }
  p { color: var(--soft); margin: 0 0 28px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.card { display: block; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--amber); outline: none; }
  a.card strong { font-size: 18px; }
  a.card span { display: block; color: var(--soft); font-size: 14px; }
  footer a { color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <h1>CAT Godot Addons</h1>
  <p>Unity용으로 만든 CAT 패키지들을 Godot 4.7+ 애드온으로 옮긴 모음입니다. 애드온별 기능 설명과 시연 영상을 볼 수 있습니다.</p>
  <ul>
    <li><a class="card" href="cat_text_fx/"><strong>CAT Text FX</strong><span>텍스트 외곽선·그림자·글로우·곡선 배치·글자별 애니메이션·전광판 흐름</span></a></li>
  </ul>
  <p style="margin-top:28px"><a href="https://github.com/zzamjak-cloud/Godot_Addon">GitHub 레포</a></p>
</div>
</body>
</html>
